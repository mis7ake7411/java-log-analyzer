[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "java-log-analyzer"
version = "1.3.0"
description = "A professional Python tool to analyze Java Logback logs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "mix7ake7411", email = "feng.school@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual==8.2.7",
    "RapidFuzz==3.14.6",
    "watchfiles==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "import-linter==2.15",
    "py-spy==0.4.2",
    "hypothesis==6.170.14",
]
portable = ["PyInstaller==6.22.3"]
portable-verify = [
    "pyte==0.8.2",
    "pywinpty==3.1.0; sys_platform == 'win32'",
]

[project.scripts]
log-analyzer = "log_analyzer.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_analyzer = ["tcss/*.tcss"]

[tool.ruff]
target-version = "py312"

[tool.importlinter]
root_package = "log_analyzer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on application or adapters"
type = "forbidden"
source_modules = ["log_analyzer.domain"]
forbidden_modules = ["log_analyzer.application", "log_analyzer.infrastructure", "log_analyzer.presentation"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on application or presentation"
type = "forbidden"
source_modules = ["log_analyzer.infrastructure"]
forbidden_modules = ["log_analyzer.application", "log_analyzer.presentation"]

[[tool.importlinter.contracts]]
name = "Application does not depend on presentation"
type = "forbidden"
source_modules = ["log_analyzer.application"]
forbidden_modules = ["log_analyzer.presentation"]

[[tool.importlinter.contracts]]
name = "Textual stays in presentation"
type = "forbidden"
source_modules = ["log_analyzer.domain", "log_analyzer.application", "log_analyzer.infrastructure"]
forbidden_modules = ["textual"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP006", "UP035", "UP045"]
extend-select = ["SIM115", "SIM117", "RET501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1711", "BLE001", "RUF005", "RUF059", "RUF100"]
ignore = ["RUF001", "RUF002", "RUF003"]
