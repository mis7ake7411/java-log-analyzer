[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "java-log-analyzer"
version = "1.0.12"
description = "A professional Python tool to analyze Java Logback logs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "mix7ake7411", email = "feng.school@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual==8.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff",
]

[project.scripts]
log-analyzer = "log_analyzer.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP006", "UP035", "UP045"]
extend-select = ["SIM115", "SIM117", "RET501", "PLR1711", "BLE001", "RUF005", "RUF059", "RUF100"]
ignore = ["RUF001", "RUF002", "RUF003"]
