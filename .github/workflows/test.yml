name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/java-log-analyzer-package-test
      - run: /tmp/java-log-analyzer-package-test/bin/python -m pip install dist/*.whl
      - run: /tmp/java-log-analyzer-package-test/bin/log-analyzer --version
      - run: |
          /tmp/java-log-analyzer-package-test/bin/python - <<'PY'
          import asyncio
          from pathlib import Path
          from log_analyzer.presentation.tui import LogAnalyzerApp

          missing = [path for path in LogAnalyzerApp.CSS_PATH if not Path(path).is_file()]
          assert LogAnalyzerApp.CSS_PATH and not missing, missing

          async def check_installed_tui():
              app = LogAnalyzerApp()
              async with app.run_test() as pilot:
                  await pilot.pause()

          asyncio.run(check_installed_tui())
          PY
