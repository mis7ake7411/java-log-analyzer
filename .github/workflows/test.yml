name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - name: Check package responsibility boundaries
        if: matrix.shard == 1
        run: uv run --locked --extra dev lint-imports --no-cache
      - run: uv run --locked --extra dev python scripts/run_test_shard.py --shard ${{ matrix.shard }}

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv export --locked --no-dev --no-emit-project --extra portable --format requirements-txt --output-file build-constraints.txt
      - run: uv build --build-constraints build-constraints.txt
      - name: Verify installed CLI and TUI outside the checkout
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile
          import textwrap
          from pathlib import Path

          wheel, = Path("dist").glob("*.whl")
          wheel = wheel.resolve()
          env = os.environ.copy()
          env.pop("PYTHONPATH", None)
          env["PYTHONIOENCODING"] = "utf-8"
          env["PYTHONDONTWRITEBYTECODE"] = "1"
          with tempfile.TemporaryDirectory(prefix="log-analyzer-package-") as directory:
              root = Path(directory)
              venv = root / "venv"
              subprocess.run(["uv", "venv", "--python", sys.executable, str(venv)], check=True)
              bin_dir = venv / ("Scripts" if os.name == "nt" else "bin")
              python = bin_dir / ("python.exe" if os.name == "nt" else "python")
              cli = bin_dir / ("log-analyzer.exe" if os.name == "nt" else "log-analyzer")
              constraints = root / "locked-runtime.txt"
              subprocess.run([
                  "uv", "export", "--locked", "--no-dev", "--no-emit-project",
                  "--format", "requirements-txt", "--output-file", str(constraints),
              ], check=True, env=env)
              subprocess.run([
                  "uv", "pip", "install", "--python", str(python),
                  "--constraint", str(constraints), str(wheel),
              ], check=True, env=env)
              work = root / "work"
              work.mkdir()

              def run(*args, **kwargs):
                  return subprocess.run(args, cwd=work, env=env, timeout=90, **kwargs)

              run(str(cli), "--version", check=True)
              run(str(python), "-m", "log_analyzer", "--version", check=True)
              source = work / "chosen.OUT"
              source.write_text(
                  "2026-10-22 12:00:00.000 [main] ERROR com.test.App - chosen-only\n",
                  encoding="utf-8",
              )
              (work / "sibling.log").write_text(
                  "2026-10-22 12:00:00.000 [main] ERROR com.test.App - excluded-sibling\n",
                  encoding="utf-8",
              )
              report = work / "report.json"
              command = (str(cli), str(source), "-f", "json", "-o", str(report))
              run(*command, check=True)
              content = report.read_bytes()
              assert b"chosen-only" in content and b"excluded-sibling" not in content
              assert run(*command).returncode != 0
              assert report.read_bytes() == content
              run(*command, "--overwrite", check=True)
              run(str(python), "-c", textwrap.dedent('''
                  import asyncio
                  from pathlib import Path
                  from log_analyzer.presentation.tui import LogAnalyzerApp

                  assert LogAnalyzerApp.CSS_PATH
                  assert all(Path(path).is_file() for path in LogAnalyzerApp.CSS_PATH)

                  async def check():
                      for size in ((80, 24), (160, 44)):
                          app = LogAnalyzerApp()
                          async with app.run_test(size=size) as pilot:
                              await pilot.pause()
                              recipe = app.query_one("#manage-recipes")
                              analyze = app.query_one("#run")
                              assert analyze.region.x - recipe.region.right >= 1
                              assert analyze.region.right <= app.screen.region.right
                              assert analyze.region.bottom <= app.screen.region.bottom
                  asyncio.run(check())
              '''), check=True)
